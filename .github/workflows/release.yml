name: Release

# Builds a SIGNED release APK on a version tag, emits the update manifest, and attaches both to a
# GitHub Release (the update mirror). Required repo secrets:
#   SIGNING_KEYSTORE        base64 of the release .jks   (base64 -w0 sieve-release.jks)
#   SIGNING_STORE_PASSWORD  keystore password
#   SIGNING_KEY_ALIAS       key alias
#   SIGNING_KEY_PASSWORD    key password
# Bump versionCode/versionName in app/build.gradle.kts to match the tag before tagging.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Decode keystore + write keystore.properties
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE }}
          STORE_PW: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PW: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/sieve-release.jks"
          cat > app/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/sieve-release.jks
          storePassword=$STORE_PW
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PW
          EOF

      - name: Assemble signed release
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Extract version + generate manifest
        id: manifest
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)"
          APK="app/build/outputs/apk/release/app-release.apk"
          # Stable asset name so releases/latest/download/Sieve.apk always resolves to the newest build.
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Sieve.apk"
          cp "$APK" "Sieve.apk"
          node tools/generate-update-manifest.mjs \
            --apk "Sieve.apk" \
            --versionCode "$VERSION_CODE" \
            --versionName "$VERSION_NAME" \
            --apkUrl "$APK_URL" \
            --out update-manifest.json

      - name: Create GitHub Release (hosts the APK + manifest)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Sieve.apk
            update-manifest.json
          fail_on_unmatched_files: true

      # The app self-updates from releases/latest/download/update-manifest.json (always fresh).
      # The GitHub Pages site (site/index.html) is the public download page. For host resilience you
      # can later add your own domain's manifest as UpdateRepository.PRIMARY_MANIFEST_URL.
